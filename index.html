<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pudim — Custos &amp; Vendas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="login-screen" style="display:none">
    <div class="login-card">
      <div class="login-brand">Pudim</div>
      <div class="login-sub">Controle de custos e vendas</div>
      <button class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 009 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Entrar com Google
      </button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <aside id="sidebar">
      <div class="brand">Pudim<small>Custos &amp; Vendas</small></div>
      <nav class="side-nav">
        <button class="nav-btn active" data-view="dash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>
          Dashboard
        </button>
        <button class="nav-btn" data-view="forn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"/><path d="M5 11c0 5.5 3.1 9 7 9s7-3.5 7-9"/><path d="M9 7c0-1.5.7-3 3-3s3 1.5 3 3"/></svg>
          Fornadas
        </button>
        <button class="nav-btn" data-view="vend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2V2H4z"/><path d="M8 7h8M8 11h5"/></svg>
          Vendas
        </button>
        <button class="nav-btn" data-view="ajst">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="8" cy="7" r="2.5" fill="var(--surface)"/><circle cx="16" cy="12" r="2.5" fill="var(--surface)"/><circle cx="10" cy="17" r="2.5" fill="var(--surface)"/></svg>
          Ajustes
        </button>
      </nav>
      <div class="side-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-email" id="user-email"></div>
          <button class="logout-btn" id="btn-logout" title="Sair">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main>
      <section id="v-dash" class="view active"></section>
      <section id="v-forn" class="view"></section>
      <section id="v-vend" class="view"></section>
      <section id="v-ajst" class="view"></section>
    </main>

    <nav id="bnav">
      <button class="bnav-btn active" data-view="dash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="bnav-btn" data-view="forn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"/><path d="M5 11c0 5.5 3.1 9 7 9s7-3.5 7-9"/><path d="M9 7c0-1.5.7-3 3-3s3 1.5 3 3"/></svg>
        <span>Fornadas</span>
      </button>
      <button class="bnav-btn" data-view="vend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2V2H4z"/><path d="M8 7h8M8 11h5"/></svg>
        <span>Vendas</span>
      </button>
      <button class="bnav-btn" data-view="ajst">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="8" cy="7" r="2.5" fill="var(--surface)"/><circle cx="16" cy="12" r="2.5" fill="var(--surface)"/><circle cx="10" cy="17" r="2.5" fill="var(--surface)"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="toast"></div>

  <div id="confirm-modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="confirm-modal-title">Confirmar exclusão</div>
      <div class="modal-message" id="confirm-modal-message"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="confirm-modal-cancel">Cancelar</button>
        <button class="btn-danger" id="confirm-modal-confirm">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
